services:
  - type: web
    name: huihui-lmstudio-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LM_STUDIO_BASE_URL
        sync: false
      - key: LM_STUDIO_API_KEY
        sync: false
      - key: LM_STUDIO_MODEL
        value: huihui-qwen3.8-27b-abliterated
