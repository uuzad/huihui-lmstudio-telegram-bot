services:
  - type: web
    name: huihui-lmstudio-telegram-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LM_STUDIO_BASE_URL
        sync: false
      - key: LM_STUDIO_API_KEY
        sync: false
      - key: LM_STUDIO_MODEL
        value: auto
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      - key: REQUEST_TIMEOUT
        value: "180"
